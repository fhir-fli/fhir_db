name: fhir_db
description: >-
  Model-independent FHIR store on SQLite (Drift): resources, versions and
  history, a search-parameter index for every FHIR search type, compartments,
  encryption. FHIR-free — the model enters through FhirModel over FhirNode;
  bindings are fhir_r4/r5/r6_db.
version: 0.14.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_db
issue_tracker: https://github.com/fhir-fli/fhir_db/issues

topics:
  - fhir
  - hl7
  - healthcare
  - database
  - sqlite

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0

# Model-independent core: NO fhir_r* dependency. The FHIR version enters at
# runtime through FhirModel<R extends FhirNode>, implemented by the separate
# fhir_r4_db / fhir_r5_db / fhir_r6_db binding packages, which also carry
# the generated per-version data (search parameter definitions, the index
# extractor, the compartment definitions).
dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  drift: ^2.33.0
  fhir_node: ^0.6.0
  fhir_path: ^0.14.2
  meta: ^1.16.0
  sqlite3: ^3.1.5

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.33.0
  test: ^1.29.0
  very_good_analysis: ^10.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
